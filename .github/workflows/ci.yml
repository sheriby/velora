name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 本地 Cargo 配置挂了 sccache；CI 不用那个包装器。
  RUSTC_WRAPPER: ''

jobs:
  test:
    name: Build & test (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Test
        # 墙钟预算类性能闸门整族 #[ignore]（perf_budgets.rs），CI 机器慢不看护
        # 性能；确定性计数闸门照常跑。
        run: cargo test --locked --bin velora

  windows-build:
    name: Build (Windows target)
    # Windows 用交叉编译检查能编过（与 release 工作流同一套工具链）；原生
    # Windows 测试基线还没有，先不上测试。
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW toolchain
        run: brew install mingw-w64

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build Windows binary
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --locked --target x86_64-pc-windows-gnu
