name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # The local Cargo config uses sccache; CI can build without that wrapper.
  RUSTC_WRAPPER: ''

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-x64
            runner: macos-15
            target: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Set application version from tag
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', tag):
              raise SystemExit(f'Invalid version tag: {tag}')
          version = tag[1:]
          # Only the CI checkout is changed; dependencies stay locked.
          manifest = Path('Cargo.toml')
          manifest.write_text(re.sub(r'(?m)^version = "[^"]+"$', f'version = "{version}"', manifest.read_text(), count=1))
          lockfile = Path('Cargo.lock')
          lockfile.write_text(re.sub(r'(\[\[package\]\]\nname = "velora"\nversion = ")[^"]+', lambda match: match[1] + version, lockfile.read_text(), count=1))
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Windows packaging tools
        if: matrix.platform == 'windows-x64'
        run: brew install mingw-w64 nsis ripgrep

      - name: Package macOS
        if: startsWith(matrix.platform, 'macos-')
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          bash scripts/package-macos.sh
          version="${RELEASE_TAG#v}"
          mv "dist/velora-$version.pkg" "dist/velora-$version-$PACKAGE_PLATFORM.pkg"

      - name: Package Windows
        if: matrix.platform == 'windows-x64'
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: bash scripts/package-windows.sh

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.pkg
            dist/*-setup.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IS_BETA: ${{ contains(github.ref_name, 'beta') }}
        run: |
          notes_file="docs/releases/$RELEASE_TAG.md"
          flags=(--verify-tag --title "$RELEASE_TAG")
          if [[ -f "$notes_file" ]] && grep -q '[^[:space:]]' "$notes_file"; then
            flags+=(--notes-file "$notes_file")
          else
            flags+=(--generate-notes)
          fi
          if [[ "$IS_BETA" == 'true' ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/* "${flags[@]}"

  update_notes:
    name: Update release notes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes_file="docs/releases/$RELEASE_TAG.md"
          if [[ ! -f "$notes_file" ]] || ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "::error::Add $notes_file with release notes before running this workflow"
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
