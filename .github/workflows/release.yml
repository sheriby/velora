name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      action:
        description: 操作（package 验证出包，update-notes 更新已发布版本的说明）
        required: true
        type: choice
        default: package
        options:
          - package
          - update-notes
      tag:
        description: 出包时可留空使用 Cargo.toml 版本；更新说明时填写现有版本标签
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ inputs.action || 'publish' }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}
  # 本地 Cargo 配置挂了 sccache；CI 不用那个包装器。
  RUSTC_WRAPPER: ''

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'package')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Set application version from tag
        if: env.RELEASE_TAG != ''
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', tag):
              raise SystemExit(f'Invalid version tag: {tag}')
          version = tag[1:]
          # 仅修改 CI 检出副本的应用版本，依赖保持锁定。
          manifest = Path('Cargo.toml')
          manifest.write_text(re.sub(r'(?m)^version = "[^"]+"$', f'version = "{version}"', manifest.read_text(encoding='utf-8'), count=1), encoding='utf-8')
          lockfile = Path('Cargo.lock')
          lockfile.write_text(re.sub(r'(\[\[package\]\]\nname = "velora"\nversion = ")[^"]+', lambda match: match[1] + version, lockfile.read_text(encoding='utf-8'), count=1), encoding='utf-8')
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Windows packaging tools
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH

      - name: Package macOS
        if: startsWith(matrix.platform, 'macos-')
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          bash scripts/package-macos.sh
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          mv "dist/velora-$version.pkg" "dist/velora-$version-$PACKAGE_PLATFORM.pkg"

      - name: Package Windows
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.pkg
            dist/*-setup.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IS_BETA: ${{ contains(github.ref_name, 'beta') }}
        run: |
          notes_file="docs/releases/$RELEASE_TAG.md"
          flags=(--verify-tag --title "$RELEASE_TAG")
          if [[ -f "$notes_file" ]] && grep -q '[^[:space:]]' "$notes_file"; then
            flags+=(--notes-file "$notes_file")
          else
            flags+=(--generate-notes)
          fi
          if [[ "$IS_BETA" == 'true' ]]; then
            flags+=(--prerelease --latest=false)
          fi
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "dist/velora-$version-macos-arm64.pkg" \
            "dist/velora-$version-macos-x64.pkg" \
            "dist/velora-$version-windows-x64-setup.exe" \
            "${flags[@]}"

  update_notes:
    name: Update release notes
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'update-notes'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "::error::更新发布说明时必须填写现有版本标签"
            exit 1
          fi
          notes_file="docs/releases/$RELEASE_TAG.md"
          if [[ ! -f "$notes_file" ]] || ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "::error::Add $notes_file with release notes before running this workflow"
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
