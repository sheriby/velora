<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Velora 内置主题预览</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #eef0f3; color: #252832; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 22px; }
    header h1 { margin: 0; font-size: 25px; letter-spacing: -.04em; }
    header p { margin: 3px 0 0; color: #657080; font-size: 12px; }
    header small { color: #657080; font-size: 12px; }
    main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .theme { min-width: 0; }
    .theme-label { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px; }
    .theme-label strong { font-size: 15px; }
    .theme-label span { color: #657080; font-size: 11px; }
    .window { height: 390px; overflow: hidden; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 13px; box-shadow: 0 7px 24px #1a25301a; }
    .chrome { height: 35px; display: grid; grid-template-columns: 68px 1fr 68px; align-items: center; background: var(--surface); border-bottom: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 10px; }
    .lights { display: flex; gap: 5px; padding-left: 12px; }
    .lights i { width: 8px; height: 8px; border-radius: 50%; background: #ff5f57; }
    .lights i:nth-child(2) { background: #febc2e; }
    .lights i:nth-child(3) { background: #28c840; }
    .body { display: grid; grid-template-columns: 105px minmax(0, 1fr); height: calc(100% - 35px); }
    aside { padding: 12px 8px; border-right: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 10px; }
    aside .folder { padding: 4px 6px 8px; color: var(--text); font-weight: 600; }
    aside .file { margin: 2px 0; padding: 5px 7px; border-radius: 5px; white-space: nowrap; }
    aside .selected { background: var(--selection); color: var(--text); }
    aside .file::before { content: "M"; margin-right: 6px; color: var(--accent); font-size: 8px; }
    .main-pane { min-width: 0; }
    .tab { height: 28px; padding: 7px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 9px; }
    .tab b { padding: 6px 9px 7px; border-top: 2px solid var(--accent); background: var(--surface); color: var(--text); font-weight: 500; }
    .document { height: calc(100% - 28px); padding: 24px 24px 16px; overflow: hidden; background: var(--surface); font-family: var(--font); }
    .eyebrow { margin: 0 0 9px; color: var(--accent); font: 600 9px/1.4 -apple-system, "PingFang SC", sans-serif; letter-spacing: .12em; }
    .document h2 { margin: 0 0 9px; font-size: 22px; line-height: 1.28; letter-spacing: -.035em; font-weight: 650; }
    .document p { margin: 0 0 13px; font-size: 11px; line-height: var(--leading); }
    .document h3 { margin: 16px 0 7px; font-size: 13px; font-weight: 650; }
    .quote { margin: 0 0 12px; padding: 6px 0 6px 9px; border-left: 2px solid var(--accent); color: var(--muted); font-size: 10px; line-height: 1.6; }
    .code { padding: 9px 10px; border-radius: 6px; background: var(--code); color: var(--text); font: 9px/1.45 Menlo, Monaco, monospace; white-space: pre; }
    .paper .document h2, .ink .document h2 { font-weight: 600; }
    .paper { --surface:#fffdf8; --panel:#f7f2e9; --text:#2c2924; --muted:#756e65; --line:#e4dacb; --accent:#9b603f; --selection:#f1e1d4; --code:#f5efe6; --font:"Songti SC", Georgia, serif; --leading:1.72; }
    .forest { --surface:#fbfcf8; --panel:#f2f6ef; --text:#263328; --muted:#637267; --line:#d7e3d5; --accent:#3f7954; --selection:#dfeee2; --code:#edf4ec; --font:-apple-system, "PingFang SC", sans-serif; --leading:1.64; }
    .midnight { --surface:#171d27; --panel:#1d2633; --text:#e8edf4; --muted:#9caabe; --line:#344254; --accent:#8bb6e9; --selection:#2d4868; --code:#202b3a; --font:-apple-system, "PingFang SC", sans-serif; --leading:1.68; }
    .ink { --surface:#171616; --panel:#201d1d; --text:#eee8dd; --muted:#aea398; --line:#3b3430; --accent:#d6a079; --selection:#503d31; --code:#282422; --font:"Songti SC", Georgia, serif; --leading:1.7; }
    .light { --surface:#fff; --panel:#f8f9fb; --text:#252832; --muted:#605e5c; --line:#d1d1d1; --accent:#6558d3; --selection:#eceaff; --code:#f2f3f6; --font:-apple-system, "PingFang SC", sans-serif; --leading:1.6; }
    .dark { --surface:#1b1d24; --panel:#20232b; --text:#e8e9ee; --muted:#a19f9d; --line:#484644; --accent:#aaa0ff; --selection:#403a61; --code:#252832; --font:-apple-system, "PingFang SC", sans-serif; --leading:1.6; }
    @media (max-width: 1050px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 700px) { body { padding: 18px; } header { display: block; } main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>Velora 内置主题</h1><p>统一的写作结构，不同的光线、色温与字体节奏。</p></div>
    <small>静态设计预览 · 不是原生窗口截图</small>
  </header>
  <main id="themes"></main>
  <script>
    const themes = [
      ["Velora Light", "light", "中性明亮"], ["Paper", "paper", "暖纸长文"], ["Forest", "forest", "柔和自然"],
      ["Velora Dark", "dark", "克制深色"], ["Midnight", "midnight", "冷调夜间"], ["Ink", "ink", "暖墨夜读"]
    ];
    document.querySelector("#themes").innerHTML = themes.map(([name, id, note]) => `
      <section class="theme ${id}">
        <div class="theme-label"><strong>${name}</strong><span>${note}</span></div>
        <div class="window">
          <div class="chrome"><div class="lights"><i></i><i></i><i></i></div><span>长文写作.md</span></div>
          <div class="body">
            <aside><div class="folder">⌄　我的文稿</div><div class="file selected">长文写作.md</div><div class="file">写作提纲.md</div></aside>
            <div class="main-pane"><div class="tab"><b>长文写作.md</b></div>
              <div class="document"><div class="eyebrow">VELORA · WRITING</div><h2>让想法自然成形</h2>
                <p>一个安静的空间，留给标题、段落和正在生长的念头。打开文件，就从上次停下的地方继续。</p>
                <h3>保留写作的节奏</h3><p>清楚的层次与合适的留白，让长篇内容读起来更轻松。</p>
                <div class="quote">专注于文字，界面会在需要时出现。</div>
                <div class="code"># 一小段代码\nlet idea = "继续写下去";</div>
              </div>
            </div>
          </div>
        </div>
      </section>`).join("");
  </script>
</body>
</html>
